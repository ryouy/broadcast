name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Smoke test deployed Worker
        run: |
          curl --fail --silent --show-error https://broadcast.ryouy.workers.dev/ | grep -q 'Broadcast'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://broadcast.ryouy.workers.dev/api/status)
          test "$status" = "503"
      - name: Package updated Worker for deployment
        run: |
          npx esbuild src/index.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=worker-bundle.js
          echo BROADCAST_BUNDLE_START
          base64 -w0 worker-bundle.js
          echo
          echo BROADCAST_BUNDLE_END
