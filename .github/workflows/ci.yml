name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check deployed Worker responses (informational)
        run: |
          echo "homepage_status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://broadcast.ryouy.workers.dev/)"
          echo "api_status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://broadcast.ryouy.workers.dev/api/status)"
          echo "auth_config=$(curl --silent --show-error --max-time 12 https://broadcast.ryouy.workers.dev/api/auth/config)"
      - name: Verify deployed Japanese UI and favicon
        run: |
          curl --fail --silent --show-error https://broadcast.ryouy.workers.dev/ | grep -q "投稿の確認"
          curl --fail --silent --show-error https://broadcast.ryouy.workers.dev/ | grep -q "更新元の設定"
          curl --fail --silent --show-error https://broadcast.ryouy.workers.dev/favicon.svg | grep -q "<svg"
      - name: Verify public Google auth configuration
        run: |
          config=$(curl --fail --silent --show-error --max-time 15 https://broadcast.ryouy.workers.dev/api/auth/config)
          echo "$config"
          test "$config" = '{"mode":"google"}'
