name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check deployed Worker responses (informational)
        run: |
          echo "homepage_status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://broadcast.ryouy.workers.dev/)"
          echo "api_status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://broadcast.ryouy.workers.dev/api/status)"
          echo "auth_config=$(curl --silent --show-error --max-time 12 https://broadcast.ryouy.workers.dev/api/auth/config)"
      - name: Verify deployed Japanese UI and favicon
        run: |
          curl --fail --silent --show-error https://broadcast.ryouy.workers.dev/ | grep -q "投稿を作る"
          curl --fail --silent --show-error https://broadcast.ryouy.workers.dev/ | grep -q "投稿一覧"
          curl --fail --silent --show-error https://broadcast.ryouy.workers.dev/favicon.svg | grep -q "<svg"
      - name: Verify retired webhook is unavailable
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://broadcast.ryouy.workers.dev/webhooks/github)" = "404"
      - name: Verify upload UI and authentication protection
        run: |
          curl --fail --silent --show-error https://broadcast.ryouy.workers.dev/ | grep -q 'id="post-file"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://broadcast.ryouy.workers.dev/api/media)" = "401"
      - name: Verify public Google auth configuration
        run: |
          config=$(curl --fail --silent --show-error --max-time 15 https://broadcast.ryouy.workers.dev/api/auth/config)
          echo "$config"
          test "$config" = '{"mode":"google"}'
      - name: Package GitHub-media Worker
        run: |
          npx esbuild src/index.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=worker-bundle.js
          echo BROADCAST_BUNDLE_START
          base64 -w0 worker-bundle.js
          echo
          echo BROADCAST_BUNDLE_END
